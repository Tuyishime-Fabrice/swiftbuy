<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>SwiftBuy — Rwanda's marketplace for verified sellers</title>
    <meta
      name="description"
      content="Buy from reviewed Rwandan sellers. Prices and totals are calculated by SwiftBuy, delivery is tracked per seller, and reviews come only from delivered orders."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Matches the dark surface so the browser chrome does not flash white. -->
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SwiftBuy" />
    <meta
      property="og:description"
      content="A marketplace for Rwandan sellers and the people who buy from them."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      SwiftBuy needs JavaScript to run. Please enable it and reload the page.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
